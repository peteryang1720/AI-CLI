# pyproject.toml
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cli"
version = "0.1.0"
description = "AI-powered CLI assistant"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "youoshin" }]
dependencies = [
    "python-dotenv",
    "dashscope",
]
requires-python = ">=3.8"

[project.scripts]
ai-cli = "cli.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*", "ai_agent*"]  # 显式包含需要的包
exclude = ["tests*", "docs*"]    # 排除测试等（可选）
